<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<body>

            <h1>أسعار السباكة</h1>

        </header>

        <!-- قائمة المنتجات والأسعار الديناميكية -->
        <main class="prices-list-container" id="pricesContainer">
            <!-- سيتم تحميل القطع والأسعار هنا أوتوماتيكياً -->
        </main>

        <footer class="app-footer">
            <a href="https://web.facebook.com/als3ydy" target="_blank" class="back-home-btn">
                📘 زور صفحتنا على فيسبوك

        </footer>
